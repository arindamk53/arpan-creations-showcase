name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build 786 Health Centers (Next.js)
        env:
          NEXT_PUBLIC_BASE_PATH: /arpan-creations-showcase/786-health-centers
        run: npm run build

      - name: Organize output for multi-site deployment
        run: |
          # Create temporary folder
          mkdir -p out-tmp
          # Move everything from out to out-tmp
          mv out/* out-tmp/ 2>/dev/null || true
          mv out/.* out-tmp/ 2>/dev/null || true

          # Re-create out folder structure
          mkdir -p out/786-health-centers
          mkdir -p out/dr-abdulla
          mkdir -p out/secret-aesthetics

          # Move all Next.js build output to 786-health-centers folder
          mv out-tmp/* out/786-health-centers/ 2>/dev/null || true

          # Copy static sites
          cp -r dr-abdulla/* out/dr-abdulla/ 2>/dev/null || true
          cp -r secret-aesthetics/* out/secret-aesthetics/ 2>/dev/null || true

      - name: Copy premium portfolio showcase landing page
        run: cp showcase-index.html out/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
