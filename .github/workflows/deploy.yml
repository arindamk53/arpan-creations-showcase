name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /arpan-creations-showcase
        run: npm run build

      - name: Copy static sites to output
        run: |
          # Copy any static site folders (non-Next.js) to out directory
          for dir in */; do
            if [ -f "${dir}index.html" ] && [ ! -f "${dir}package.json" ]; then
              echo "Copying static site: $dir"
              cp -r "$dir" out/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4